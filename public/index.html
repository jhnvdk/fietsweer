<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b1d2c">
    <meta name="description" content="Bekijk de fietsscore voor vandaag en morgen op jouw locatie.">
    <title>Fietsweer | Activiteiten</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="search-panel" aria-label="Zoek weer op locatie">
        <form id="location-form" class="location-form">
          <label for="location-input">Kies je locatie</label>
          <div class="search-row">
            <div class="input-wrap">
              <span class="pin-icon" aria-hidden="true">⌖</span>
              <input id="location-input" name="location" type="search" placeholder="Plaats of stad" autocomplete="address-level2" maxlength="100" required>
            </div>
            <button type="submit"><span>Toon fietsscore</span><span class="button-arrow" aria-hidden="true">↗</span></button>
          </div>
        </form>
      </section>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      <section id="weather-results" class="weather-results" aria-live="polite" hidden>
        <div class="results-heading">
          <p id="place-name" class="place-name"></p>
        </div>
        <div class="activity-table-wrap">
          <table class="activity-table">
            <thead><tr id="score-days"><th scope="col" class="activity-heading"></th></tr></thead>
            <tbody><tr id="cycling-scores"><th scope="row" class="activity-name">
              <svg class="bike-icon" viewBox="0 0 64 44" aria-hidden="true">
                <circle cx="13" cy="31" r="10"></circle><circle cx="51" cy="31" r="10"></circle>
                <path d="m13 31 12-18 10 18H13l9-13h16l13 13M25 13h-7m14 0h8l5 8"></path>
              </svg>
              <span>Fietsen</span>
            </th></tr></tbody>
          </table>
        </div>
        <p class="source-note">Weerdata door Infoplaza</p>
      </section>
    </main>
  </body>
</html>
