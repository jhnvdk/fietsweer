<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b1d2c">
    <meta name="description" content="Bekijk de fietsscore voor de komende vijf dagen op basis van je locatie.">
    <title>Fietsweer | Activiteiten</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="search-panel" aria-label="Zoek weer op locatie">
        <form id="location-form" class="location-form">
          <label for="location-input">Kies je locatie</label>
          <div class="search-row">
            <div class="input-wrap">
              <span class="pin-icon" aria-hidden="true">⌖</span>
              <input id="location-input" name="location" type="search" placeholder="Plaats of stad" autocomplete="address-level2" maxlength="100" required>
            </div>
            <button type="submit"><span class="button-label">Toon fietsweer</span><span class="button-arrow" aria-hidden="true">↗</span></button>
            <div class="location-actions">
              <button id="current-location-button" class="current-location-button" type="button">
                <span class="location-button-icon" aria-hidden="true">⌖</span>
                <span class="button-label">Gebruik mijn locatie</span>
              </button>
              <button class="country-map-button" type="button" data-country="netherlands" aria-label="Kaart van Nederland" title="Nederland" aria-haspopup="dialog">
                <span aria-hidden="true">🇳🇱</span>
              </button>
              <button class="country-map-button" type="button" data-country="belgium" aria-label="Kaart van België" title="België" aria-haspopup="dialog">
                <span aria-hidden="true">🇧🇪</span>
              </button>
            </div>
          </div>
        </form>
      </section>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      <section id="weather-results" class="weather-results" aria-live="polite" hidden>
        <div class="results-heading">
          <p id="place-name" class="place-name"></p>
        </div>
        <div class="activity-table-wrap">
          <table class="activity-table" aria-label="Fietsscores per dag">
            <thead><tr id="score-days"></tr></thead>
            <tbody><tr id="cycling-scores" aria-label="Fietsscore"></tr></tbody>
          </table>
        </div>
        <p class="source-note">Weerdata door Infoplaza</p>
      </section>
      <section class="compare-panel" aria-labelledby="compare-title">
        <h2 id="compare-title" class="compare-title">Vergelijk drie bestemmingen</h2>
        <p class="compare-intro">Plan je fietsvakantie: zie welke plek de komende vijf dagen het beste fietsweer heeft.</p>
        <form id="compare-form" class="compare-form">
          <div class="compare-inputs">
            <label>Bestemming 1
              <input name="compare-location" type="search" placeholder="Bijv. Maastricht" maxlength="100" required>
            </label>
            <label>Bestemming 2
              <input name="compare-location" type="search" placeholder="Bijv. Bouillon" maxlength="100" required>
            </label>
            <label>Bestemming 3
              <input name="compare-location" type="search" placeholder="Bijv. Texel" maxlength="100" required>
            </label>
          </div>
          <button id="compare-button" type="submit"><span class="button-label">Vergelijk</span><span class="button-arrow" aria-hidden="true">↗</span></button>
        </form>
        <p id="compare-status" class="compare-status" role="status" aria-live="polite"></p>
        <div id="compare-results" class="compare-results" hidden>
          <p id="compare-winner" class="compare-winner"></p>
          <div class="compare-table-wrap">
            <table class="compare-table" aria-label="Fietsscores per bestemming en dag">
              <thead><tr id="compare-head"></tr></thead>
              <tbody id="compare-body"></tbody>
            </table>
          </div>
          <p class="source-note">Weerdata door Infoplaza · klik op een score voor het volledige weerbericht</p>
        </div>
      </section>
      <dialog id="day-weather-dialog" class="day-weather-dialog" aria-labelledby="day-weather-title">
        <form method="dialog" class="dialog-actions">
          <button class="dialog-close" type="submit" aria-label="Sluiten">×</button>
        </form>
        <p class="dialog-eyebrow">Dagverwachting</p>
        <h2 id="day-weather-title"></h2>
        <p id="day-weather-summary" class="dialog-summary"></p>
        <dl id="day-weather-details" class="day-weather-details"></dl>
      </dialog>
      <dialog id="overview-map-dialog" class="overview-map-dialog" aria-labelledby="overview-map-title">
        <form method="dialog" class="dialog-actions">
          <button class="dialog-close" type="submit" aria-label="Sluiten">×</button>
        </form>
        <div class="overview-map-toolbar">
          <div>
            <p class="dialog-eyebrow">Fietsscores per provinciehoofdstad</p>
            <h2 id="overview-map-title">Nederland</h2>
            <p id="overview-map-status" class="overview-map-status" role="status" aria-live="polite">Kaart laden…</p>
          </div>
          <label for="overview-map-day">Dag
            <select id="overview-map-day" disabled></select>
          </label>
        </div>
        <div id="overview-map" class="overview-map" aria-label="Kaart met fietsscores in de provinciehoofdsteden"></div>
      </dialog>
    </main>
  </body>
</html>
