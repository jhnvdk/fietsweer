<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f5ee">
    <meta name="description" content="Choose a place and see the cycling score for today and tomorrow.">
    <title>Fietsweer | Ride score</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Fietsweer home">
        <span class="wordmark-mark" aria-hidden="true">f.</span><span>fietsweer</span>
      </a>
      <span class="topbar-note">Your ride score</span>
    </header>
    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Plan your ride</p>
        <h1 id="page-title">How good is<br><span>today for a ride?</span></h1>
      </section>
      <section class="search-panel" aria-label="Search weather by location">
        <form id="location-form" class="location-form">
          <label for="location-input">Choose your place</label>
          <div class="search-row">
            <div class="input-wrap">
              <span class="pin-icon" aria-hidden="true">⌖</span>
              <input id="location-input" name="location" type="search" placeholder="City or town" autocomplete="address-level2" maxlength="100" required>
            </div>
            <button type="submit"><span>Show ride score</span><span class="button-arrow" aria-hidden="true">↗</span></button>
          </div>
        </form>
      </section>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
      <section id="weather-results" class="weather-results" aria-live="polite" hidden>
        <div class="results-heading">
          <p id="place-name" class="place-name"></p>
          <span class="score-scale">Ride score / 10</span>
        </div>
        <div id="score-list" class="score-list"></div>
      </section>
    </main>
  </body>
</html>
