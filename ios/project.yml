# XcodeGen spec. CI runs `xcodegen generate` to create Fietsweer.xcodeproj (not committed).
name: Fietsweer
options:
  bundleIdPrefix: nl.bidutch
  developmentLanguage: nl
  deploymentTarget:
    iOS: "17.0"
packages:
  FietsweerCore:
    path: FietsweerCore
targets:
  Fietsweer:
    type: application
    platform: iOS
    sources:
      - path: Fietsweer
    dependencies:
      - package: FietsweerCore
    info:
      path: Fietsweer/Info.plist
      properties:
        CFBundleDisplayName: Fietsweer
        CFBundleDevelopmentRegion: nl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.weather
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Fietsweer gebruikt je locatie om de fietsscore voor waar je nu bent te tonen.
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.bidutch.fietsweer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.10"
        ENABLE_PREVIEWS: YES
