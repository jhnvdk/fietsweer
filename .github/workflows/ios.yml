name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test shared code
        working-directory: ios/FietsweerCore
        run: swift test

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml

      - name: Build for simulator
        if: github.event_name == 'pull_request'
        run: |
          xcodebuild build \
            -project ios/Fietsweer.xcodeproj -scheme Fietsweer \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Upload to TestFlight on pushes to main and manual runs.
      - name: Write App Store Connect key
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # The archive is built unsigned; the export step signs it with an Apple-managed
      # distribution certificate, so no certificates or devices are needed here.
      - name: Archive
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild archive \
            -project ios/Fietsweer.xcodeproj -scheme Fietsweer -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fietsweer.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign and upload to TestFlight
        if: github.event_name != 'pull_request'
        run: |
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTIONS"
          plutil -insert method -string app-store-connect "$OPTIONS"
          plutil -insert destination -string upload "$OPTIONS"
          plutil -insert teamID -string "${{ secrets.APPLE_TEAM_ID }}" "$OPTIONS"
          plutil -insert signingStyle -string automatic "$OPTIONS"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fietsweer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
